## Sprint 16 — MCP Read-Only Tools — Not Started

**Goal:** Expose bounded, non-sensitive project status through MCP without
granting device-control authority.

### Initial Tool Candidates

```text
room.get_environment
network.get_status
system.get_status
display.get_current_screen
```

### Tasks

- [ ] Define exact tool names, input schemas, output schemas, timeout, and error
      semantics.
- [ ] Read only through existing public snapshot APIs.
- [ ] Return explicit validity and stale/unavailable information.
- [ ] Bound JSON and text allocations, preferring PSRAM where safe.
- [ ] Reject credentials, tokens, activation information, QR payloads, private
      NVS data, and raw pointers.
- [ ] Test concurrent calls, sensor unavailable/stale, network transitions, and
      voice/cloud/UI coexistence.

### Sprint 16 Acceptance

- [ ] Every tool has schema and error tests.
- [ ] No tool accesses a driver directly.
- [ ] No sensitive data is exposed.
- [ ] No deadlock occurs with audio, cloud, sensor, or GUI tasks.
- [ ] Read-only MCP can be disabled without affecting voice conversation.

### Learning Topics

- MCP tool schemas
- Read-only capability design
- Bounded JSON serialization
- Snapshot APIs and stale data

