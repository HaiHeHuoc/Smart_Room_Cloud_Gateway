## Voice Extension Cross-Sprint Validation Matrix

Each Sprint 10-18 closure must record:

- exact firmware revision and dependency lock;
- board, microphone, amplifier, speaker, power source, and GPIO map;
- internal, DMA, and PSRAM current/minimum/largest values;
- CPU use and task stack high-water marks;
- task, queue, handler, socket, and decoder counts where observable;
- Wi-Fi loss and recovery behavior;
- reset/provisioning preemption behavior;
- audio overflow/underrun counts;
- sensitive-log review;
- hardware evidence and unresolved limitations.

Required integrated fault cases before final voice closure:

```text
Wi-Fi loss while connecting
Wi-Fi loss while listening
Wi-Fi loss while speaking
Internet-only outage
Xiaozhi server unavailable
activation/authentication rejection
transport reconnect
cloud retry overlap
playback queue full
capture overflow
rapid PTT press/release
cancel while thinking
abort while speaking
missing/corrupt animation asset
SD unmount
provisioning/reset preemption
100 voice-turn endurance
8-hour wake-word endurance when Sprint 18 is enabled
```

## Voice Extension Final Definition Of Done

The extension is complete only when:

- the exact pinned dependencies build reproducibly;
- audio hardware and `audio_manager` are independently accepted;
- Xiaozhi activation, storage, transport, lifecycle, and fault behavior are
  documented and accepted;
- `voice_assistant` preserves all component ownership boundaries;
- Push-to-Talk conversation and limited multi-turn behavior are stable;
- transcript and chatbot animations are queue-driven and hardware-accepted;
- MCP tools are bounded, allowlisted, and do not expose sensitive data;
- wake word is marked complete only if its separate feasibility and endurance
  gates pass;
- disabling the voice extension preserves the original Sprints 0-9 behavior;
- no unfinished earlier phase is silently reclassified as complete.
