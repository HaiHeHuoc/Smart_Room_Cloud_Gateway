name: Apply Xiaozhi roadmap update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-xiaozhi-roadmap.yml

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace voice assistant roadmap section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ESP32S3_Smart_Room_Cloud_Gateway_Roadmap.md")
          text = path.read_text(encoding="utf-8")
          marker = "## Proposed Voice Assistant Extension — New"
          marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit(f"Roadmap marker not found: {marker}")

          prefix = text[:marker_index]
          tail = r'''## Proposed Voice Assistant Extension — Approved Implementation Syllabus

The following Sprints 10-18 are an approved post-MVP extension for integrating
Espressif's `esp_xiaozhi` managed component, production audio, voice interaction,
chatbot UI, MCP tools, and optional wake-word UX.

This extension does not replace, reorder, or silently close Sprints 0-9. Any
unfinished hardware acceptance or reliability work in the existing roadmap
remains visible and must be completed or explicitly deferred before the voice
extension is treated as production-ready.

### Extension Status

```text
Sprints 10-18: Approved syllabus / Not started
Voice MVP closure point: End of Sprint 15
Advanced voice closure point: End of Sprint 18
```

### Confirmed Dependency Baseline

- Initial managed-component baseline: `espressif/esp_xiaozhi: "0.1.1"`.
- Supported ESP-IDF baseline for that release: ESP-IDF `>=5.5`; the project
  currently targets ESP-IDF 6.0.1.
- Pin the exact component version and commit `dependencies.lock`.
- Re-check the official component registry, changelog, API, license, service
  behavior, activation requirements, and transitive dependencies immediately
  before Sprint 12 begins.
- Do not silently float to a newer component version.
- Treat `esp_xiaozhi` as a protocol dependency, not as the application owner.

Official planning references reviewed for the approved syllabus:

- Component source:
  <https://github.com/espressif/esp-iot-solution/tree/master/components/esp_xiaozhi>
- Managed component page:
  <https://components.espressif.com/components/espressif/esp_xiaozhi>
- Official Xiaozhi chat example:
  <https://github.com/espressif/esp-iot-solution/tree/master/examples/ai/xiaozhi_chat>

### Required Dependency Order

```text
Sprints 0-9 and their pending acceptance
    -> Sprint 10 audio hardware validation
    -> Sprint 11 production audio_manager
    -> Sprint 12 esp_xiaozhi foundation
    -> Sprint 13 project-owned voice_assistant adapter
    -> Sprint 14 push-to-talk and limited multi-turn MVP
    -> Sprint 15 GUI voice and interactive chatbot animation
    -> Sprint 16 MCP read-only tools
    -> Sprint 17 MCP controlled device actions
    -> Sprint 18 wake word and advanced voice UX
```

### Milestone Structure

| Milestone | Sprints | Result |
|---|---:|---|
| Audio Foundation | 10-11 | Stable microphone, speaker, I2S, buffering, and diagnostics |
| Xiaozhi Foundation | 12-13 | Pinned dependency, transport, activation, lifecycle, and adapter |
| Voice MVP | 14-15 | Push-to-talk conversation, limited multi-turn, transcript, and animation |
| Device Intelligence | 16-17 | MCP read-only tools followed by controlled actions |
| Advanced Voice | 18 | Wake word, VAD, privacy UX, and optional advanced audio features |

### Preserved Ownership

```text
wifi_manager             owns Wi-Fi Station lifecycle and reconnect
provisioning_manager     owns temporary BLE provisioning transport
config_manager           owns persistent application configuration
cloud_manager            owns Firebase telemetry and retry policy
audio_manager            owns microphone, speaker, I2S, DMA staging and PCM flow
voice_assistant          owns esp_xiaozhi lifecycle and protocol adaptation
app_gui                  owns GUI models, queues, screens and animation selection
ui_manager_lvgl          owns LVGL runtime and synchronization
lvgl_image_handler       owns decoded image/GIF resources and active image objects
device/application APIs  own validated sensor and actuator operations
```

Only the project-owned `voice_assistant` component may include
`esp_xiaozhi` headers. External handles, enums, transport objects, and callback
payload types must not leak into other public component APIs.

No Xiaozhi, audio, network, or MCP callback may directly:

- call LVGL;
- connect or disconnect Wi-Fi;
- start or stop provisioning;
- erase or write application NVS;
- reboot the device;
- execute OTA;
- control arbitrary GPIO or hardware drivers.

### Voice PSRAM Allocation Policy

The N16R8 target has 8 MiB Octal PSRAM. Voice work follows a PSRAM-first policy
for bulk and long-lived data while preserving internal RAM for deterministic,
DMA-capable, cache-off, ISR, and hardware-critical work.

Every new voice/audio allocation must be classified as one of:

```text
INTERNAL_REQUIRED
DMA_REQUIRED
PSRAM_PREFERRED
PSRAM_REQUIRED
```

Rules:

1. Bulk buffers must not silently fall back to internal RAM.
2. PSRAM-required allocations must be verified with
   `esp_ptr_external_ram(pointer)`.
3. DMA buffers and descriptors must use internal DMA-capable memory.
4. Do not globally move every task stack to PSRAM. Move tasks individually only
   after auditing NVS, flash, cache-off, OTA, and reset paths.
5. NVS, flash, partition erase, factory-reset persistence, and OTA work must run
   from internal-stack tasks.
6. Do not allocate or free memory per audio frame. Use bounded, preallocated
   pools and rings.
7. Each phase must record internal RAM, DMA RAM, PSRAM, largest free block,
   minimum free memory, CPU usage, and task stack high-water marks.

PSRAM candidates:

- PCM capture and playback rings;
- encoded OPUS packet queues;
- playback jitter buffers;
- voice transcript and emotion caches;
- bounded JSON and MCP buffers;
- GUI voice queues and animation model data;
- selected voice/audio worker stacks after cache-off audit;
- wake-word models and supported AFE working memory.

Internal/DMA candidates:

- I2S DMA buffers and descriptors;
- ISR-accessed state;
- portMUX/spinlocks and critical flags;
- small current-session state and generation counters;
- library-owned network/TLS allocations that cannot be redirected;
- storage/reset/OTA task stacks.

### Resource Readiness Gate

Before integrated Push-to-Talk acceptance, measure the complete production
baseline and meet or formally revise the following engineering targets:

| Metric | Initial target |
|---|---:|
| Internal steady-state free | >= 24 KiB |
| Largest internal free block | >= 12-16 KiB |
| Internal low-water during voice | >= 10-12 KiB |
| DMA steady-state free before audio start | >= 20 KiB |
| DMA low-water during voice | >= 6-8 KiB |
| PSRAM free | >= 6 MiB |
| Voice/audio task stack remaining | >= 20% |
| Heap-loss trend after 100 voice turns | None |
| Nominal audio overflow/underrun | None |
| Watchdog, Guru Meditation, or LVGL assertion | None |

These values are project engineering gates, not universal Espressif limits.
They may be revised only from measured target-hardware evidence.

---

## Sprint 10 — Audio Hardware Validation — Not Started

**Goal:** Prove microphone capture and speaker output independently before
adding a production audio component or Xiaozhi dependency.

### Phase 10.1 — Hardware And Pin Audit

- [ ] Select and document the production microphone path.
- [ ] Prefer a digital I2S microphone for the production voice path.
- [ ] Confirm MAX98357A or the selected I2S output path.
- [ ] Confirm speaker impedance, power, amplifier enable, voltage, and ground.
- [ ] Audit BCLK, WS/LRCLK, DIN, DOUT, MCLK if used, and enable pins against
      LCD, SD, DHT22, button, USB, boot straps, and existing GPIO ownership.
- [ ] Freeze the validated audio GPIO map in board configuration.

The existing analog microphone module may be used for ADC experiments but is
not the preferred production baseline for network voice interaction.

### Phase 10.2 — Isolated Microphone Capture

- [ ] Create an isolated audio-capture test application.
- [ ] Start with 16 kHz, mono, signed 16-bit PCM.
- [ ] Record at least 30 seconds of known speech and silence.
- [ ] Measure DC offset, noise floor, clipping, peak amplitude, and dropped
      samples.
- [ ] Validate I2S RX start, stop, re-start, and deinit.
- [ ] Store long capture buffers in PSRAM and keep DMA staging internal.

### Phase 10.3 — Isolated Speaker Playback

- [ ] Create an isolated playback test using a known tone or PCM/WAV sample.
- [ ] Validate I2S TX start, stop, re-start, and deinit.
- [ ] Measure distortion, amplifier noise, volume behavior, underrun count, and
      speaker stability.
- [ ] Store source/playback rings in PSRAM and keep DMA staging internal.

### Phase 10.4 — Audio Coexistence And Baseline

- [ ] Run audio with LVGL, SD, Wi-Fi, sensor sampling, button input, and cloud
      services enabled.
- [ ] Measure CPU/core use, internal RAM, DMA RAM, PSRAM, largest blocks, task
      stacks, RX overflow, and TX underrun.
- [ ] Repeat initialization and shutdown across at least 20 reboot cycles.
- [ ] Freeze the validated sample format and initial DMA configuration.

### Sprint 10 Acceptance

- [ ] Microphone capture runs for 30 minutes without an uncontrolled overflow.
- [ ] Speaker playback runs for 30 minutes without corruption or uncontrolled
      underrun.
- [ ] No watchdog, crash, or LVGL failure occurs during coexistence testing.
- [ ] Audio pins, format, and measured resource baseline are documented.

### Learning Topics

- ESP-IDF I2S channel API
- Sample rate, bit depth, channels, and framing
- DMA buffers and descriptors
- Audio signal validation
- PSRAM versus internal/DMA memory

---

## Sprint 11 — Production `audio_manager` — Not Started

**Goal:** Create the project-owned component that exclusively owns microphone,
speaker, I2S, bounded audio buffers, and diagnostics.

### Proposed Structure

```text
components/audio/audio_manager/
├── CMakeLists.txt
├── Kconfig
├── audio_manager.c
├── include/
│   └── audio_manager.h
└── docs/
    └── README.md
```

### Phase 11.1 — Lifecycle And Public API

- [ ] Define idempotent `init`, `start`, `stop`, and `deinit` behavior.
- [ ] Define capture start/stop and bounded playback submission APIs.
- [ ] Expose copied status snapshots, not I2S handles or DMA descriptors.
- [ ] Define explicit error behavior for repeated or invalid lifecycle calls.

Illustrative project-owned API shape:

```c
esp_err_t audio_manager_init(const audio_manager_config_t *config);
esp_err_t audio_manager_start(void);
esp_err_t audio_manager_stop(void);
esp_err_t audio_manager_deinit(void);
esp_err_t audio_manager_start_capture(void);
esp_err_t audio_manager_stop_capture(void);
esp_err_t audio_manager_submit_playback(
    const uint8_t *data,
    size_t length,
    TickType_t timeout);
esp_err_t audio_manager_get_status(audio_manager_status_t *status);
```

The final API must be based on measured requirements and may differ from this
planning sketch.

### Phase 11.2 — Buffer And Task Design

- [ ] Add bounded PSRAM-backed capture and playback rings.
- [ ] Keep I2S DMA buffers and descriptors in internal DMA-capable RAM.
- [ ] Use preallocated pools; prohibit per-frame allocation in the hot path.
- [ ] Define finite queue timeouts, producer/consumer ownership, overflow
      policy, drop policy, underrun recovery, and shutdown draining.
- [ ] Measure task priority and core affinity instead of guessing.
- [ ] Move individual task stacks to PSRAM only after cache-off audit.

### Phase 11.3 — Status And Diagnostics

Track at minimum:

```text
state
capture_active
playback_active
rx_overflow_count
tx_underrun_count
captured_bytes
played_bytes
last_error
```

### Phase 11.4 — Stress Closure

- [ ] Run 1,000 capture/playback start-stop cycles.
- [ ] Test repeated init/deinit and partial-init cleanup.
- [ ] Test producer faster than consumer, queue full, playback starvation, and
      network reconnect while audio resources exist.
- [ ] Confirm no monotonic internal, DMA, or PSRAM loss.

### Sprint 11 Acceptance

- [ ] No direct LVGL or network calls exist inside `audio_manager`.
- [ ] No unbounded queue or allocation exists.
- [ ] No use-after-free or duplicate task/channel occurs.
- [ ] Task stack remaining is at least 20% in the measured worst case.
- [ ] The component works with the production project baseline.

### Learning Topics

- Ring buffers and producer-consumer design
- Real-time audio tasking
- Buffer ownership and backpressure
- Capability-based heap allocation
- Lifecycle stress testing

---

## Sprint 12 — `esp_xiaozhi` Foundation — Not Started

**Goal:** Pin, audit, build, activate, and lifecycle-test the official managed
component before production voice UX integration.

### Phase 12.1 — Dependency And License Audit

- [ ] Re-check the managed component registry at implementation time.
- [ ] Pin the exact approved version in `idf_component.yml`.
- [ ] Commit the resulting dependency lock.
- [ ] Record IDF compatibility, license, transitive dependencies, flash delta,
      IRAM/DRAM delta, and binary-size delta.
- [ ] Document all public headers and lifecycle APIs used by the project.

### Phase 12.2 — Official Example And API Inventory

- [ ] Build an isolated Xiaozhi transport test application on the N16R8 target.
- [ ] Reproduce the official lifecycle before adapting it to project code.
- [ ] Document exact init/start/stop/deinit, info, audio, event, MCP, and system
      command APIs.
- [ ] Document callback context, pointer lifetime, buffer ownership, and the
      current single-chat-instance restriction.
- [ ] Create `docs/XIAOZHI_API_INVENTORY.md` and
      `docs/XIAOZHI_DEPENDENCY_AUDIT.md`.

### Phase 12.3 — Service, Device Info, And Activation

- [ ] Validate `esp_xiaozhi_chat_get_info()` and release all returned data.
- [ ] Document service endpoint, serial/device identity, activation code or
      challenge, timeout, account requirements, and failure recovery.
- [ ] Audit which transport settings the component persists to NVS.
- [ ] Define a private Xiaozhi keystore namespace and factory-reset policy.
- [ ] Keep application Wi-Fi/device configuration owned by `config_manager`.
- [ ] Do not log activation secrets, tokens, credentials, or private payloads.

### Phase 12.4 — Side-Effect And Storage Audit

- [ ] Review system-time synchronization and disable it initially unless the
      project explicitly assigns clock ownership to Xiaozhi.
- [ ] Review info timeout, response-size limit, audio task stack, task core,
      allocation mode, UDP buffer, and hello-message Kconfig values.
- [ ] Route Xiaozhi NVS operations through an internal-stack storage service if
      PSRAM task stacks would otherwise enter cache-off NVS paths.
- [ ] Define explicit cleanup for Xiaozhi-only stored data.

### Phase 12.5 — Transport Decision

Do not hardcode WebSocket without measuring the server configuration and
component behavior.

```text
get_info()
    -> only WebSocket available: validate WebSocket
    -> only MQTT available: validate MQTT + UDP
    -> both available: validate the component's preferred path first,
                       then compare fallback behavior
```

- [ ] Compare connection time, reconnect, sockets, heap, CPU, audio loss,
      cleanup, and network-failure behavior.
- [ ] Record the chosen MVP transport in an architecture decision record.

### Phase 12.6 — Lifecycle And Fault Matrix

- [ ] Validate `get_info -> init -> start -> connected -> stop -> deinit`.
- [ ] Run at least 100 complete lifecycle cycles.
- [ ] Test Wi-Fi loss while connecting and connected.
- [ ] Test repeated start, stop-before-start, deinit-while-running, partial-init
      failure, server goodbye, malformed response, and allocation failure.
- [ ] Confirm only one instance can exist and that cleanup returns resources.

### Sprint 12 Acceptance

- [ ] The pinned component builds on ESP-IDF 6.0.1 and target hardware.
- [ ] Activation, storage, transport, and side effects are documented.
- [ ] The transport choice is evidence-based.
- [ ] One hundred lifecycle cycles show no leak trend or duplicate resources.
- [ ] Disabling the feature restores the pre-Xiaozhi firmware behavior.

### Learning Topics

- ESP-IDF Component Manager
- Dependency pinning and lockfiles
- WebSocket versus MQTT/UDP transport
- Activation and private keystore design
- External component lifecycle auditing

---

## Sprint 13 — Project-Owned `voice_assistant` — Not Started

**Goal:** Hide `esp_xiaozhi` behind a project-owned lifecycle, state machine,
security policy, and bounded event interface.

### Proposed Structure

```text
components/voice/voice_assistant/
├── CMakeLists.txt
├── Kconfig
├── idf_component.yml
├── voice_assistant.c
├── voice_assistant_xiaozhi.c
├── voice_assistant_storage.c
├── include/
│   └── voice_assistant.h
└── docs/
    └── README.md
```

`voice_assistant_xiaozhi.c` is a private adapter. No Xiaozhi header belongs in
the public include directory.

### Phase 13.1 — Project State And Public API

Define project-owned states such as:

```text
DISABLED
INITIALIZING
DISCONNECTED
CONNECTING
IDLE
LISTENING
THINKING
SPEAKING
ERROR
```

- [ ] Define copied configuration and status snapshots.
- [ ] Define lifecycle, push-to-talk, cancel, network notification, and status
      APIs without exposing external types.
- [ ] Define single-owner semantics for the Xiaozhi handle.

### Phase 13.2 — Bounded Command Queue And State Machine

Commands include:

```text
START
STOP
NETWORK_ONLINE
NETWORK_OFFLINE
BEGIN_LISTENING
END_LISTENING
CANCEL
SHUTDOWN
```

- [ ] Invoke Xiaozhi APIs only from the owning worker context.
- [ ] Define valid transitions, finite timeouts, retry limits, and terminal
      failures.
- [ ] Add generation/epoch filtering for stale network and session events.

### Phase 13.3 — Event Conversion And Copy Policy

- [ ] Map connection, audio channel, text, TTS, emotion, server goodbye, and
      error events into project-owned data.
- [ ] Copy all callback-lifetime text, emotion, error source, and audio data
      before callback return.
- [ ] Bound and validate every copied string and payload.
- [ ] Keep callbacks short and non-blocking.

Initial state mapping:

| Xiaozhi fact | Project state |
|---|---|
| Connected | `IDLE` |
| Disconnected | `DISCONNECTED` |
| Audio channel opened | `LISTENING` |
| User utterance completed | `THINKING` |
| TTS started | `SPEAKING` |
| TTS stopped | `IDLE` or conversation-wait state |
| Protocol error | `ERROR` or bounded recovery |
| System command | Reject and audit by default |

### Phase 13.4 — Network Integration

- [ ] Consume copied connectivity facts from `wifi_manager`.
- [ ] Never take ownership of Station connect/disconnect or provisioning.
- [ ] Stop/restart the voice transport through bounded policy.
- [ ] Prevent voice recovery from disrupting cloud, reset, or provisioning.

### Phase 13.5 — Security Boundary

Default-deny server actions:

```text
reboot
OTA
NVS erase
Wi-Fi reconfiguration
provisioning start
arbitrary GPIO
raw shell/system commands
```

Initially allowed facts:

```text
connection events
bounded text
TTS state
bounded emotion
audio frames
explicitly registered MCP tools
```

### Sprint 13 Acceptance

- [ ] Only `voice_assistant` depends directly on `esp_xiaozhi`.
- [ ] Public headers contain no external Xiaozhi types.
- [ ] No callback calls LVGL, Wi-Fi lifecycle, storage erase, reboot, or driver
      APIs.
- [ ] Stale events are rejected by generation/epoch.
- [ ] Repeated lifecycle tests create no duplicate task, socket, or handler.
- [ ] Feature-off behavior preserves the production baseline.

### Learning Topics

- Adapter pattern
- Event-driven state machines
- Generation and epoch filtering
- Callback ownership and lifetime
- Security boundaries for server-driven events

---

## Sprint 14 — Push-To-Talk Voice MVP — Not Started

**Goal:** Complete reliable spoken interaction from user speech to Xiaozhi
response playback while preserving existing project services.

### Target Interaction

```text
User presses a dedicated PTT button
    -> microphone capture starts
    -> audio channel opens
    -> encoded audio is sent
    -> user releases the button
    -> listening stops
    -> Xiaozhi processes the request
    -> TTS audio is received
    -> speaker plays the response
    -> session returns to ready or a bounded conversation-wait state
```

### Phase 14.1 — Input And Privacy Policy

- [ ] Use a dedicated Push-to-Talk input where practical.
- [ ] Do not overload the factory-reset long-press gesture with voice capture.
- [ ] Show an explicit local listening indicator.
- [ ] Stream microphone audio only during an authorized voice turn.
- [ ] Define mute, cancel, timeout, and privacy behavior.

### Phase 14.2 — Audio Uplink

- [ ] Feed PCM from `audio_manager` into the approved OPUS/audio adapter.
- [ ] Freeze sample rate, channel count, frame duration, bitrate, timestamps,
      queue depth, and packet ownership.
- [ ] Store PCM and encoded queues in PSRAM; retain only DMA staging internally.
- [ ] Define bounded backpressure and frame-drop behavior.

### Phase 14.3 — Audio Downlink

- [ ] Copy callback-lifetime audio into a bounded PSRAM playback pool.
- [ ] Feed playback only through `audio_manager`.
- [ ] Never decode or write I2S directly in a Xiaozhi callback.
- [ ] Define jitter, queue-full, underrun, cancel, and shutdown behavior.

### Phase 14.4 — Cancellation And Recovery

- [ ] Test release, double press, cancel while thinking, abort while speaking,
      Wi-Fi loss while listening, Wi-Fi loss while speaking, timeout, playback
      queue full, and reconnect followed by a new turn.
- [ ] Begin with half-duplex behavior; full duplex is not an MVP requirement.
- [ ] Avoid simultaneous Firebase TLS handshakes and active Xiaozhi audio/TLS
      peaks when measured headroom is insufficient.
- [ ] Allow `cloud_manager` to retain only its newest telemetry while voice is
      active and resume upload when voice returns idle if required by resource
      measurements.

### Phase 14.5 — Limited Multi-Turn Conversation

**Goal:** Provide a chatbot-like conversation without requiring always-on audio
or full duplex.

- [ ] Keep the conversation/session open for a bounded interval after a reply.
- [ ] Initial target conversation-wait timeout: 20-30 seconds, subject to
      transport behavior and measurement.
- [ ] Permit another PTT question during the active conversation window.
- [ ] Preserve server-side conversation context only through supported Xiaozhi
      session behavior; do not invent unsupported local context semantics.
- [ ] Define maximum idle time, maximum consecutive turns, cancel, disconnect,
      and session-renewal behavior.
- [ ] Keep bounded current-session transcript data for GUI use.
- [ ] Close the session cleanly on timeout, reset, provisioning priority,
      network loss, or explicit cancel.

### Sprint 14 Acceptance

- [ ] Complete at least 100 consecutive voice turns without a leak trend.
- [ ] Microphone audio is transmitted only during an authorized turn.
- [ ] No accidental factory reset occurs.
- [ ] No unbounded audio queue exists.
- [ ] Network loss recovers to a usable state.
- [ ] Sensor, cloud state, button recovery, and LVGL remain operational.
- [ ] Limited multi-turn follow-up works within the documented session window.
- [ ] No watchdog, crash, stale session, or nominal audio overflow/underrun.

### Learning Topics

- Push-to-Talk UX
- PCM-to-OPUS streaming
- Backpressure and jitter buffering
- Session timeout and multi-turn context
- Resource arbitration across TLS, audio, and cloud

---

## Sprint 15 — GUI Voice Integration And Interactive Chatbot — Not Started

**Goal:** Add a queue-driven voice screen, transcript, status, emotion, and
interactive chatbot animation without violating LVGL ownership.

### Phase 15.1 — Voice Screen Foundation

- [ ] Add a dedicated voice screen with bounded regions for animation, state,
      transcript, and error/network indication.
- [ ] Preserve the existing root-screen switching model.
- [ ] Keep provisioning, reset result, and critical recovery screens at higher
      routing priority than the voice screen.

Initial screen priority:

```text
RESET_RESULT
    > PROVISIONING
    > critical network recovery
    > VOICE
    > SENSOR_DASHBOARD
```

### Phase 15.2 — Voice UI Data Model And Queue

Define a copied project-owned model containing at minimum:

```text
voice state
bounded UTF-8 text
bounded emotion
generation
last error
```

- [ ] Add a bounded GUI voice queue, preferably latest-value/coalescing where
      intermediate states are not required.
- [ ] Validate UTF-8 and avoid truncating inside a multi-byte code point.
- [ ] Reject stale generations.
- [ ] Only the GUI task creates, updates, or deletes LVGL objects.

### Phase 15.3 — State And Transcript Rendering

Render at least:

```text
Offline
Connecting
Ready
Listening
Thinking
Speaking
Error
```

- [ ] Display copied user and assistant text when available.
- [ ] Define transcript lifetime, maximum bytes, clearing, and screen re-entry.
- [ ] Coalesce rapid updates to avoid flooding the UI task.
- [ ] Return to the dashboard through a bounded policy after terminal errors or
      session close.

### Phase 15.4 — Interactive Chatbot Animation Runtime

**Goal:** Display an animated chatbot character that reacts to conversation
state and approved Xiaozhi emotion data.

Required default animation states:

```text
Disconnected -> offline animation
Connecting   -> connecting animation
Ready        -> idle animation
User talks   -> listening animation
Processing   -> thinking animation
Xiaozhi talks-> speaking animation
Error        -> error animation
```

Suggested project-owned animation enum:

```text
OFFLINE
CONNECTING
IDLE
LISTENING
THINKING
SPEAKING
ERROR
```

Suggested SD asset layout:

```text
S:/voice/offline.gif
S:/voice/connecting.gif
S:/voice/idle.gif
S:/voice/listening.gif
S:/voice/thinking.gif
S:/voice/speaking.gif
S:/voice/error.gif
```

Optional allowlisted emotion assets:

```text
S:/voice/happy.gif
S:/voice/sad.gif
S:/voice/speaking_happy.gif
S:/voice/speaking_sad.gif
```

Rules:

- [ ] Resolve animation only inside the GUI task.
- [ ] Never construct a file path directly from an untrusted server emotion
      string.
- [ ] Convert supported emotions into a project-owned allowlisted enum.
- [ ] State has priority over emotion. `ERROR`, `LISTENING`, `THINKING`, and
      `SPEAKING` cannot be overwritten by a stale emotion event.
- [ ] Do not reload a GIF when the resolved animation has not changed.
- [ ] Coalesce rapid animation updates and reject stale generations.
- [ ] Clear active GIF resources safely when leaving the voice screen.
- [ ] Restore the newest copied voice state when returning to the screen rather
      than replaying stale events.
- [ ] Prefer PSRAM for GIF frames and decoder working memory.
- [ ] Avoid per-frame allocation and excessive SD re-open operations.
- [ ] Begin with assets sized for the 160x128 display and approximately 8-15
      FPS; increase only from measured decode and audio coexistence data.
- [ ] A missing or corrupt GIF falls back to a static image, then status text.
      Animation failure must never fail the voice session.

Animation event flow:

```text
esp_xiaozhi callback
    -> voice_assistant copies and validates event
    -> project voice state/emotion model
    -> bounded app_gui queue
    -> GUI task animation resolver
    -> lvgl_image_handler
```

### Phase 15.5 — Voice GUI Performance And Hardware Closure

- [ ] Exercise `IDLE -> LISTENING -> THINKING -> SPEAKING -> IDLE` repeatedly.
- [ ] Change emotions during speaking and verify allowlisted mapping.
- [ ] Test Wi-Fi/Xiaozhi disconnect while an animation is active.
- [ ] Test provisioning/reset screen preemption.
- [ ] Test missing assets, corrupt GIF, SD unmount, rapid state updates, and
      repeated voice-screen enter/exit.
- [ ] Run at least 100 voice turns while monitoring GIF decoder resources,
      PSRAM fragmentation, internal/DMA low-water, GUI responsiveness, and
      audio underrun.

### Sprint 15 Acceptance — Voice MVP Complete

- [ ] Voice state, transcript, and animation render correctly.
- [ ] Emotion mapping uses a bounded allowlist.
- [ ] No Xiaozhi/audio/network callback calls LVGL.
- [ ] No stale animation or transcript appears after reconnect/session change.
- [ ] Missing/corrupt assets do not crash or terminate voice.
- [ ] No GIF decoder leak, stale LVGL object, or use-after-free occurs.
- [ ] Animation does not produce nominal audio overflow/underrun.
- [ ] GUI remains responsive without watchdog or assertion.
- [ ] Provisioning and reset screens retain higher priority.

Completion of Sprint 15 closes the planned Push-to-Talk voice chatbot MVP:

```text
Push-to-Talk
+ speech recognition through Xiaozhi service
+ LLM response
+ text-to-speech playback
+ bounded transcript
+ limited multi-turn session
+ interactive state/emotion animation
```

### Learning Topics

- Queue-driven LVGL models
- UTF-8 bounded rendering
- Animated GIF lifecycle
- State-versus-emotion resolution
- UI priority and preemption
- Audio/animation coexistence

