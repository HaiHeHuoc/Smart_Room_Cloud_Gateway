## Sprint 17 — MCP Controlled Device Actions — Not Started

**Goal:** Add allowlisted, validated device actions only after the project has a
real component that owns each actuator.

### Candidate Actions

```text
display.set_brightness
light.set_state
fan.set_state
servo.set_angle
```

These are candidates, not promises. Do not expose an action until the
corresponding manager and hardware ownership exist.

### Execution Flow

```text
MCP request
    -> validate schema, range, authorization, and request ID
    -> project command queue
    -> owning device manager
    -> physical/result confirmation
    -> bounded MCP response
```

### Tasks

- [ ] Define tool allowlist, range validation, timeout, error codes, request ID,
      idempotency, duplicate suppression, and late-result policy.
- [ ] Route every action through a project-owned manager queue.
- [ ] Report actual execution result rather than requested state alone.
- [ ] Add bounded audit diagnostics without logging private conversation data.
- [ ] Test malformed, repeated, out-of-range, unavailable-device, timeout, and
      concurrent requests.

Always rejected:

```text
factory reset
credential erase
reboot
arbitrary OTA
arbitrary GPIO
task control
shell/system commands
```

### Sprint 17 Acceptance

- [ ] Every action is allowlisted and range-validated.
- [ ] Duplicate and late requests are handled deterministically.
- [ ] Physical state matches reported success.
- [ ] Disabling MCP actions preserves local control and voice conversation.
- [ ] No server request can bypass component ownership.

### Learning Topics

- Command validation
- Idempotency and duplicate handling
- Device-manager ownership
- Server-controlled action security

