## Sprint 18 — Wake Word And Advanced Voice UX — Not Started

**Goal:** Evaluate and, only if feasible, add local wake word, VAD, privacy UX,
and advanced conversation behavior after the Push-to-Talk MVP is stable.

### Phase 18.1 — ESP-SR / WakeNet Feasibility

- [ ] Select and pin the exact ESP-SR/WakeNet model and dependencies.
- [ ] Measure model flash, PSRAM, internal/DMA RAM, CPU, task stacks, and
      continuous I2S requirements.
- [ ] Validate compatibility with the existing LCD, SD, Wi-Fi, cloud, and
      Xiaozhi workload.
- [ ] Treat model and AFE memory placement as measured requirements, not
      assumptions.

### Phase 18.2 — Continuous Capture, Wake Word, And VAD

- [ ] Add continuous local capture without continuous network transmission.
- [ ] Add wake-word detection and VAD through project-owned state flow.
- [ ] Add visible microphone/listening and local mute indicators.
- [ ] Define false-accept, false-reject, timeout, and re-arm behavior.

### Phase 18.3 — Advanced Conversation UX

Optional measured features:

- [ ] Interrupt speaking through an explicit abort path.
- [ ] Continue a bounded conversation after wake word.
- [ ] Evaluate echo behavior and acoustic feedback.
- [ ] Evaluate AFE/AEC only after wake word and VAD are stable.
- [ ] Evaluate full duplex only if CPU, DMA, memory, and acoustics justify it.

Do not introduce early:

```text
always-on network microphone transmission
unbounded conversation history
full duplex before half-duplex closure
AEC before acoustic and resource measurement
unversioned downloaded models
```

### Sprint 18 Acceptance

- [ ] Complete at least 1,000 wake cycles.
- [ ] Complete an 8-hour always-on local wake-word endurance run.
- [ ] Record false-accept and false-reject behavior.
- [ ] Verify mute and privacy indicators.
- [ ] Publish CPU, internal RAM, DMA RAM, PSRAM, stack, and thermal results.
- [ ] Factory reset, provisioning, and critical recovery always preempt voice.
- [ ] No watchdog, leak trend, or uncontrolled audio failure occurs.

### Learning Topics

- ESP-SR, AFE, WakeNet, and VAD
- Continuous audio pipelines
- Privacy UX
- Acoustic echo and full-duplex trade-offs
- Long-duration embedded voice validation

