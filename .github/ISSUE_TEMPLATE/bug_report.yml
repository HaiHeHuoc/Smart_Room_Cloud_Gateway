name: Bug report
description: Report a reproducible firmware, hardware, build, or documentation problem.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, Wi-Fi credentials, readable provisioning QR payloads, private keys, private URLs, or personal account data. Follow SECURITY.md for vulnerabilities.

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the observed behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Build commit ...
        2. Flash ...
        3. Connect ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        Board: ESP32-S3 N16R8
        ESP-IDF version:
        Commit:
        Connected peripherals:
        Power source:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or evidence
      description: Remove credentials, tokens, SSIDs when private, QR payloads, account data, and unrelated notifications.
      render: text

  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I removed credentials, tokens, private keys, private URLs, QR secrets, and personal information.
          required: true
        - label: This report does not contain vulnerability details that should be reported privately.
          required: true
