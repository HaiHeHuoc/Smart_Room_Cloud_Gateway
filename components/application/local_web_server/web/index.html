<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Room Control</title>
  <style>
    :root{color-scheme:dark;--bg:#101827;--card:#1d293a;--text:#eef5ff;--muted:#9badc3;--line:#33435a;--accent:#62b7ff;--err:#ff9696}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:18px}header,nav,.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:1.35rem;margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:16px;padding:14px}#capacity{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:10px}.metric{color:var(--muted);font-size:.82rem}.metric b{display:block;color:var(--text);font-size:1.05rem;margin-top:3px}button,select{background:#263a53;color:var(--text);border:1px solid #4e6d90;border-radius:7px;padding:8px 11px;font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}#path{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.state{color:var(--muted);margin:12px 0 0}.error{color:var(--err)}#drop{border:1px dashed #5b789d;border-radius:8px;padding:12px;margin-top:12px;color:var(--muted);text-align:center}progress{width:100%;margin-top:8px}ul{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 3px;border-bottom:1px solid var(--line);align-items:center}.entry{background:none;border:0;padding:0;text-align:left;color:var(--text);min-width:0;overflow-wrap:anywhere}.entry.dir{color:var(--accent)}.meta{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{padding:5px 8px;font-size:.85rem}.playback-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.playback-row select{flex:1;min-width:180px}@media(max-width:480px){main{padding:12px}#capacity{grid-template-columns:1fr}li{grid-template-columns:1fr}}
    .tab-list{display:flex;justify-content:flex-start;gap:8px;margin-top:16px;border-bottom:1px solid var(--line)}.tab{border-radius:7px 7px 0 0;border-bottom:0;color:var(--muted)}.tab[aria-selected="true"]{background:var(--card);color:var(--text);border-color:var(--accent);box-shadow:inset 0 -2px var(--accent)}.tab-panel[hidden]{display:none}
  </style>
</head>
<body>
  <main>
    <header><h1>Smart Room Control</h1><span id="availability">Checking SD...</span></header>
    <nav class="tab-list" role="tablist" aria-label="Local Web controls">
      <button class="tab" id="tab-storage" type="button" role="tab" aria-selected="true" aria-controls="panel-storage" data-tab="storage">Storage</button>
      <button class="tab" id="tab-playback" type="button" role="tab" aria-selected="false" aria-controls="panel-playback" data-tab="playback" tabindex="-1">Playback</button>
    </nav>
    <section class="tab-panel" id="panel-storage" role="tabpanel" aria-labelledby="tab-storage">
      <section class="card" id="capacity"><div class="metric">Total<b id="total">-</b></div><div class="metric">Used<b id="used">-</b></div><div class="metric">Free<b id="free">-</b></div></section>
      <section class="card">
        <nav><button id="up" type="button">Up</button><strong id="path">/</strong><button id="mkdir" type="button">New folder</button></nav>
        <div id="drop">Drop one file here, or <input id="file" type="file"><button id="upload" type="button">Upload</button><progress id="progress" max="100" value="0" hidden></progress></div>
        <p class="state" id="state" role="status">Loading...</p><ul id="entries"></ul>
      </section>
    </section>
    <section class="tab-panel" id="panel-playback" role="tabpanel" aria-labelledby="tab-playback" hidden>
      <section class="card" id="playback">
        <nav><strong>Playback</strong><span id="pb-state">Loading...</span></nav>
        <p class="playback-row"><select id="pb-track"><option>Loading tracks...</option></select><button id="pb-play" type="button" disabled>Play</button></p>
        <p class="playback-row"><button id="pb-pause" type="button">Pause</button><button id="pb-resume" type="button">Resume</button><button id="pb-restart" type="button">Restart</button><button id="pb-stop" type="button">Stop</button></p>
        <progress id="pb-progress" max="1" value="0"></progress><p id="pb-position" class="state">-</p>
        <label>Volume <input id="pb-volume" type="range" min="0" max="100" value="100"> <span id="pb-volume-value">100%</span></label>
      </section>
    </section>
  </main>
  <script>
    (() => {
      const q = selector => document.querySelector(selector);
      const state = q('#state'), list = q('#entries');
      const bytes = value => { const units = ['B','KB','MB','GB']; let unit = 0; while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; } return `${value.toFixed(unit ? 1 : 0)} ${units[unit]}`; };
      const join = (parent, name) => `${parent === '/' ? '' : parent}/${name}`;
      const parent = value => value === '/' ? '/' : (value.slice(0, value.lastIndexOf('/')) || '/');
      let path = '/', busy = false, catalogIds = new Map(), polling = false, pollTimer = 0, activeTab = 'storage';
      const setState = (text, error = false) => { state.textContent = text; state.className = `state${error ? ' error' : ''}`; };
      const setBusy = value => { busy = value; q('#upload').disabled = value; q('#mkdir').disabled = value; };
      const post = async url => { const response = await fetch(url, {method:'POST',cache:'no-store'}); const body = await response.json(); if (!response.ok) throw Error(body.error); return body; };

      function selectTab(nextTab) {
        activeTab = nextTab;
        document.querySelectorAll('[role="tab"]').forEach(tab => {
          const selected = tab.dataset.tab === nextTab;
          tab.setAttribute('aria-selected', String(selected));
          tab.tabIndex = selected ? 0 : -1;
          q(`#panel-${tab.dataset.tab}`).hidden = !selected;
        });
        if (nextTab === 'playback') tickPlayback();
      }

      function renderStoragePlayButtons() {
        if (path !== '/audio') return;
        list.querySelectorAll('li').forEach(row => {
          const entry = row.querySelector('.entry:not(.dir)'), actions = row.querySelector('.actions');
          if (!entry || !actions || actions.querySelector('[data-audio-play]')) return;
          const trackId = catalogIds.get(entry.textContent);
          if (!trackId) return;
          const button = document.createElement('button');
          button.dataset.audioPlay = '1'; button.textContent = 'Play';
          button.onclick = async () => { button.disabled = true; try { await playTrack(trackId); } catch (error) { setState(`Play rejected (${error.message}).`, true); } finally { button.disabled = false; } };
          actions.prepend(button);
        });
      }

      async function storageStatus() {
        try { const response = await fetch('/api/storage/status',{cache:'no-store'}), data = await response.json(); if (!response.ok) throw Error(data.error); q('#availability').textContent = data.available ? 'SD ready' : `SD ${data.state}`; q('#total').textContent = bytes(data.total_bytes); q('#used').textContent = bytes(data.used_bytes); q('#free').textContent = bytes(data.free_bytes); }
        catch (_) { q('#availability').textContent = 'SD unavailable'; }
      }

      async function browse(nextPath = path) {
        path = nextPath; q('#path').textContent = path; q('#up').disabled = path === '/' || busy; list.replaceChildren(); setState('Loading...');
        try {
          const response = await fetch(`/api/storage/list?path=${encodeURIComponent(path)}`,{cache:'no-store'}), data = await response.json();
          if (!response.ok) throw Error(data.error);
          path = data.path; q('#path').textContent = path;
          if (!data.entries.length) setState('This directory is empty.'); else {
            setState(data.truncated ? 'Showing a bounded result.' : '');
            for (const item of data.entries) {
              const row = document.createElement('li'), name = document.createElement(item.type === 'directory' ? 'button' : 'span'), right = document.createElement('span'), meta = document.createElement('span'), actions = document.createElement('span');
              name.className = `entry ${item.type === 'directory' ? 'dir' : ''}`; name.textContent = item.type === 'directory' ? `> ${item.name}` : item.name;
              if (item.type === 'directory') name.onclick = () => browse(join(path, item.name));
              meta.className = 'meta'; meta.textContent = item.type === 'file' ? bytes(item.size_bytes) : item.type; actions.className = 'actions';
              const rename = document.createElement('button'); rename.textContent = 'Rename'; rename.onclick = () => renameItem(item.name); actions.append(rename);
              if (item.type === 'file') { const download = document.createElement('button'), remove = document.createElement('button'); download.textContent = 'Download'; download.onclick = () => { location = `/api/storage/download?path=${encodeURIComponent(join(path,item.name))}`; }; remove.textContent = 'Delete'; remove.onclick = () => removeItem(item.name, false); actions.append(download, remove); }
              else { const remove = document.createElement('button'); remove.textContent = 'Remove'; remove.onclick = () => removeItem(item.name, true); actions.append(remove); }
              right.append(meta, actions); row.append(name, right); list.append(row);
            }
            renderStoragePlayButtons();
          }
        } catch (error) { setState(`Unable to browse (${error.message}).`, true); }
      }

      async function removeItem(name, directory) { if (!confirm(`Remove ${name}?`)) return; setBusy(true); try { await post(`/api/storage/${directory ? 'rmdir' : 'delete'}?path=${encodeURIComponent(join(path,name))}`); await browse(); await storageStatus(); } catch (error) { setState(`Operation failed (${error.message}).`, true); } finally { setBusy(false); } }
      async function renameItem(name) { const next = prompt('New name:',name); if (!next || next === name) return; setBusy(true); try { await post(`/api/storage/rename?src=${encodeURIComponent(join(path,name))}&dest=${encodeURIComponent(join(path,next))}`); await browse(); } catch (error) { setState(`Rename failed (${error.message}).`, true); } finally { setBusy(false); } }
      async function makeDir() { const name = prompt('Folder name:'); if (!name) return; setBusy(true); try { await post(`/api/storage/mkdir?path=${encodeURIComponent(join(path,name))}`); await browse(); } catch (error) { setState(`Create failed (${error.message}).`, true); } finally { setBusy(false); } }
      function upload(file) { if (!file || busy) return; setBusy(true); const progress = q('#progress'); progress.hidden = false; progress.value = 0; setState(`Uploading ${file.name}...`); const xhr = new XMLHttpRequest(); xhr.open('POST',`/api/storage/upload?path=${encodeURIComponent(join(path,file.name))}`); xhr.upload.onprogress = event => { if (event.lengthComputable) progress.value = 100 * event.loaded / event.total; }; xhr.onload = async () => { try { const data = JSON.parse(xhr.responseText || '{}'); if (xhr.status < 200 || xhr.status >= 300) throw Error(data.error || 'upload_failed'); setState('Upload complete.'); await browse(); await storageStatus(); } catch (error) { setState(`Upload failed (${error.message}).`, true); } finally { progress.hidden = true; setBusy(false); } }; xhr.onerror = () => { progress.hidden = true; setBusy(false); setState('Upload interrupted; temporary file removed.', true); }; xhr.send(file); }

      async function playTrack(trackId) { await post(`/api/audio/play?track_id=${encodeURIComponent(trackId)}`); tickPlayback(); }
      async function loadTracks() { try { const response = await fetch('/api/audio/tracks',{cache:'no-store'}), data = await response.json(); if (!response.ok) throw Error(data.error); const select = q('#pb-track'); select.replaceChildren(); catalogIds = new Map(data.tracks.map(track => [track.filename, track.id])); for (const track of data.tracks) { const option = document.createElement('option'); option.value = track.id; option.textContent = track.name; select.append(option); } q('#pb-play').disabled = !data.tracks.length; renderStoragePlayButtons(); } catch (_) { q('#pb-state').textContent = 'Catalog unavailable'; } }
      async function tickPlayback() {
        if (polling || document.hidden) return;
        polling = true;
        try {
          const response = await fetch('/api/audio/status',{cache:'no-store'}), data = await response.json(); if (!response.ok) throw Error(data.error);
          q('#pb-state').textContent = `${data.state} (${data.source})`; q('#pb-volume').value = data.volume_percent; q('#pb-volume-value').textContent = `${data.volume_percent}%`;
          const active = activeTab === 'playback' &&
              ['playing','starting','pausing','resuming'].includes(data.state);
          q('#pb-pause').disabled = data.state !== 'playing'; q('#pb-resume').disabled = data.state !== 'paused'; q('#pb-stop').disabled = !active && data.state !== 'paused'; q('#pb-restart').disabled = !data.resumable;
          if (data.total_frames) { q('#pb-progress').max = data.total_frames; q('#pb-progress').value = Math.min(data.position_frames, data.total_frames); q('#pb-position').textContent = `${data.position_frames} / ${data.total_frames} frames`; } else q('#pb-position').textContent = 'Progress unavailable';
          clearTimeout(pollTimer); pollTimer = setTimeout(tickPlayback, active ? 750 : 2500);
        } catch (error) { q('#pb-state').textContent = `Playback unavailable (${error.message})`; clearTimeout(pollTimer); pollTimer = setTimeout(tickPlayback, 2500); }
        finally { polling = false; }
      }

      q('#up').onclick = () => browse(parent(path)); q('#mkdir').onclick = makeDir; q('#upload').onclick = () => upload(q('#file').files[0]);
      const drop = q('#drop'); drop.ondragover = event => { event.preventDefault(); drop.style.borderColor = '#62b7ff'; }; drop.ondragleave = () => { drop.style.borderColor = ''; }; drop.ondrop = event => { event.preventDefault(); drop.style.borderColor = ''; upload(event.dataTransfer.files[0]); };
      const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
      tabs.forEach((tab, index) => {
        tab.onclick = () => selectTab(tab.dataset.tab);
        tab.onkeydown = event => {
          if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
          event.preventDefault();
          const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 :
              (index + (event.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
          tabs[next].focus(); selectTab(tabs[next].dataset.tab);
        };
      });
      q('#pb-play').onclick = async () => { try { await playTrack(q('#pb-track').value); } catch (error) { q('#pb-state').textContent = `Play rejected (${error.message})`; } };
      for (const action of ['pause','resume','restart','stop']) q(`#pb-${action}`).onclick = async () => { try { await post(`/api/audio/control?action=${action}`); tickPlayback(); } catch (error) { q('#pb-state').textContent = `Control rejected (${error.message})`; } };
      q('#pb-volume').onchange = async event => { try { const data = await post(`/api/audio/volume?percent=${event.target.value}`); q('#pb-volume-value').textContent = `${data.volume_percent}%`; } catch (error) { q('#pb-state').textContent = `Volume rejected (${error.message})`; } };
      document.addEventListener('visibilitychange', () => { if (!document.hidden) tickPlayback(); });
      storageStatus(); browse(); loadTracks(); tickPlayback();
    })();
  </script>
</body>
</html>
