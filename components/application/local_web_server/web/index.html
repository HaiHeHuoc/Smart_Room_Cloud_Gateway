<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Room Storage</title><style>
:root{color-scheme:dark;--bg:#101827;--card:#1d293a;--text:#eef5ff;--muted:#9badc3;--line:#33435a;--accent:#62b7ff;--err:#ff9696}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:18px}header,nav,.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:1.35rem;margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:16px;padding:14px}#capacity{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:10px}.metric{color:var(--muted);font-size:.82rem}.metric b{display:block;color:var(--text);font-size:1.05rem;margin-top:3px}button{background:#263a53;color:var(--text);border:1px solid #4e6d90;border-radius:7px;padding:8px 11px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#path{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.state{color:var(--muted);margin:12px 0 0}.error{color:var(--err)}#drop{border:1px dashed #5b789d;border-radius:8px;padding:12px;margin-top:12px;color:var(--muted);text-align:center}progress{width:100%;margin-top:8px}ul{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 3px;border-bottom:1px solid var(--line);align-items:center}.entry{background:none;border:0;padding:0;text-align:left;color:var(--text);min-width:0;overflow-wrap:anywhere}.entry.dir{color:var(--accent)}.meta{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{padding:5px 8px;font-size:.85rem}@media(max-width:480px){main{padding:12px}#capacity{grid-template-columns:1fr}li{grid-template-columns:1fr}}
</style></head><body><main><header><h1>Storage</h1><span id="availability">Checking SD...</span></header>
<section class="card" id="capacity"><div class="metric">Total<b id="total">-</b></div><div class="metric">Used<b id="used">-</b></div><div class="metric">Free<b id="free">-</b></div></section>
<section class="card"><nav><button id="up" type="button">Up</button><strong id="path">/</strong><button id="mkdir" type="button">New folder</button></nav><div id="drop">Drop one file here, or <input id="file" type="file"><button id="upload" type="button">Upload</button><progress id="progress" max="100" value="0" hidden></progress></div><p class="state" id="state" role="status">Loading...</p><ul id="entries"></ul></section>
</main><script>(()=>{const q=s=>document.querySelector(s),state=q('#state'),list=q('#entries');let path='/',busy=false;const bytes=n=>{const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`},join=(p,n)=>`${p==='/'?'':p}/${n}`,parent=p=>p==='/'?'/':(p.slice(0,p.lastIndexOf('/'))||'/'),setState=(t,e=false)=>{state.textContent=t;state.className=`state${e?' error':''}`},setBusy=v=>{busy=v;q('#upload').disabled=v;q('#mkdir').disabled=v};async function api(url){const r=await fetch(url,{method:'POST',cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function status(){try{const r=await fetch('/api/storage/status',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);q('#availability').textContent=d.available?'SD ready':`SD ${d.state}`;q('#total').textContent=bytes(d.total_bytes);q('#used').textContent=bytes(d.used_bytes);q('#free').textContent=bytes(d.free_bytes)}catch(e){q('#availability').textContent='SD unavailable'}}async function browse(next=path){path=next;q('#path').textContent=path;q('#up').disabled=path==='/'||busy;list.replaceChildren();setState('Loading...');try{const r=await fetch(`/api/storage/list?path=${encodeURIComponent(path)}`,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);path=d.path;q('#path').textContent=path;if(!d.entries.length)setState('This directory is empty.');else{setState(d.truncated?'Showing a bounded result.':'');for(const item of d.entries){const li=document.createElement('li'),name=document.createElement(item.type==='directory'?'button':'span'),right=document.createElement('span'),meta=document.createElement('span'),actions=document.createElement('span');name.className=`entry ${item.type==='directory'?'dir':''}`;name.textContent=item.type==='directory'?`> ${item.name}`:item.name;if(item.type==='directory')name.onclick=()=>browse(join(path,item.name));meta.className='meta';meta.textContent=item.type==='file'?bytes(item.size_bytes):item.type;actions.className='actions';const rename=document.createElement('button');rename.textContent='Rename';rename.onclick=()=>renameItem(item.name);actions.append(rename);if(item.type==='file'){const down=document.createElement('button');down.textContent='Download';down.onclick=()=>location=`/api/storage/download?path=${encodeURIComponent(join(path,item.name))}`;const del=document.createElement('button');del.textContent='Delete';del.onclick=()=>removeItem(item.name,false);actions.append(down,del)}else if(item.type==='directory'){const del=document.createElement('button');del.textContent='Remove';del.onclick=()=>removeItem(item.name,true);actions.append(del)}right.append(meta,actions);li.append(name,right);list.append(li)}}}catch(e){setState(`Unable to browse (${e.message}).`,true)}}async function removeItem(name,dir){if(!confirm(`Remove ${name}?`))return;setBusy(true);try{await api(`/api/storage/${dir?'rmdir':'delete'}?path=${encodeURIComponent(join(path,name))}`);await browse();await status()}catch(e){setState(`Operation failed (${e.message}).`,true)}finally{setBusy(false)}}async function renameItem(name){const next=prompt('New name:',name);if(!next||next===name)return;setBusy(true);try{await api(`/api/storage/rename?src=${encodeURIComponent(join(path,name))}&dest=${encodeURIComponent(join(path,next))}`);await browse();}catch(e){setState(`Rename failed (${e.message}).`,true)}finally{setBusy(false)}}async function makeDir(){const name=prompt('Folder name:');if(!name)return;setBusy(true);try{await api(`/api/storage/mkdir?path=${encodeURIComponent(join(path,name))}`);await browse();}catch(e){setState(`Create failed (${e.message}).`,true)}finally{setBusy(false)}}function upload(file){if(!file||busy)return;setBusy(true);const progress=q('#progress');progress.hidden=false;progress.value=0;setState(`Uploading ${file.name}...`);const xhr=new XMLHttpRequest();xhr.open('POST',`/api/storage/upload?path=${encodeURIComponent(join(path,file.name))}`);xhr.upload.onprogress=e=>{if(e.lengthComputable)progress.value=100*e.loaded/e.total};xhr.onload=async()=>{try{const d=JSON.parse(xhr.responseText||'{}');if(xhr.status<200||xhr.status>=300)throw Error(d.error||'upload_failed');setState('Upload complete.');await browse();await status()}catch(e){setState(`Upload failed (${e.message}).`,true)}finally{progress.hidden=true;setBusy(false)}};xhr.onerror=()=>{progress.hidden=true;setBusy(false);setState('Upload interrupted; temporary file removed.',true)};xhr.send(file)}q('#up').onclick=()=>browse(parent(path));q('#mkdir').onclick=makeDir;q('#upload').onclick=()=>upload(q('#file').files[0]);const drop=q('#drop');drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='#62b7ff'};drop.ondragleave=()=>drop.style.borderColor='';drop.ondrop=e=>{e.preventDefault();drop.style.borderColor='';upload(e.dataTransfer.files[0])};status();browse()})();</script></body></html>
<script>(()=>{const main=document.querySelector('main'),card=document.createElement('section');card.className='card';card.innerHTML='<nav><strong>Playback</strong><span id="pb-state">Loading...</span></nav><p><select id="pb-track"><option>Loading tracks...</option></select> <button id="pb-play">Play</button></p><p><button id="pb-pause">Pause</button> <button id="pb-resume">Resume</button> <button id="pb-restart">Restart</button> <button id="pb-stop">Stop</button></p><progress id="pb-progress" max="1" value="0"></progress><p id="pb-position" class="state">-</p><label>Volume <input id="pb-volume" type="range" min="0" max="100" value="100"> <span id="pb-volume-value">100%</span></label>';main.append(card);const q=s=>card.querySelector(s),post=async u=>{const r=await fetch(u,{method:'POST',cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);return d};let running=false,timer=0;async function tracks(){try{const r=await fetch('/api/audio/tracks',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);q('#pb-track').replaceChildren();for(const t of d.tracks){const o=document.createElement('option');o.value=t.id;o.textContent=t.name;q('#pb-track').append(o)}q('#pb-play').disabled=!d.tracks.length}catch(e){q('#pb-state').textContent='Catalog unavailable'}}async function tick(){if(running||document.hidden)return;running=true;try{const r=await fetch('/api/audio/status',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);q('#pb-state').textContent=`${d.state} (${d.source})`;q('#pb-volume').value=d.volume_percent;q('#pb-volume-value').textContent=`${d.volume_percent}%`;const active=d.state==='playing'||d.state==='starting'||d.state==='pausing'||d.state==='resuming';q('#pb-pause').disabled=d.state!=='playing';q('#pb-resume').disabled=d.state!=='paused';q('#pb-stop').disabled=!active&&d.state!=='paused';q('#pb-restart').disabled=!d.resumable;if(d.total_frames){q('#pb-progress').max=d.total_frames;q('#pb-progress').value=Math.min(d.position_frames,d.total_frames);q('#pb-position').textContent=`${d.position_frames} / ${d.total_frames} frames`}else q('#pb-position').textContent='Progress unavailable';clearTimeout(timer);timer=setTimeout(tick,active?750:2500)}catch(e){q('#pb-state').textContent=`Playback unavailable (${e.message})`;clearTimeout(timer);timer=setTimeout(tick,2500)}finally{running=false}}q('#pb-play').onclick=async()=>{try{await post(`/api/audio/play?track_id=${encodeURIComponent(q('#pb-track').value)}`);tick()}catch(e){q('#pb-state').textContent=`Play rejected (${e.message})`}};for(const a of ['pause','resume','restart','stop'])q(`#pb-${a}`).onclick=async()=>{try{await post(`/api/audio/control?action=${a}`);tick()}catch(e){q('#pb-state').textContent=`Control rejected (${e.message})`}};q('#pb-volume').onchange=async e=>{try{const d=await post(`/api/audio/volume?percent=${e.target.value}`);q('#pb-volume-value').textContent=`${d.volume_percent}%`}catch(e){q('#pb-state').textContent=`Volume rejected (${e.message})`}};document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});tracks();tick()})();</script>
